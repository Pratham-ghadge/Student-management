name: Azure Static Web Apps CI/CD

# ✅ Force GitHub to use Node.js 24 (latest runtime)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || 
        (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    permissions:
      id-token: write
      contents: read

    steps:
      # ✅ Checkout latest code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ Get GitHub OIDC token (needed for Azure auth)
      - name: Get GitHub ID Token
        id: idtoken
        uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core')
            return await core.getIDToken()
          result-encoding: string

      # 🚀 Build and Deploy to Azure Static Web Apps
      - name: Build and Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_FIELD_02C702000 }}
          action: "upload"
          app_location: "./frontend"     # your React app folder
          api_location: ""               # no backend (leave empty)
          output_location: "build"       # React build folder
          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && 
        github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request Deployment
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"